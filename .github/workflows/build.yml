name: CI
on: [push]
permissions: {}
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        node: [18, 19, 20, 21, 22, 23, 24, 25, 26]
        # Path of the Google Chrome preinstalled on each GitHub runner image,
        # used to run the karma tests (see the "Install" step below).
        include:
          - os: ubuntu-latest
            chrome_bin: /usr/bin/google-chrome
          - os: macos-latest
            chrome_bin: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
          - os: windows-latest
            chrome_bin: C:\Program Files\Google\Chrome\Application\chrome.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        name: Checkout
        with:
          persist-credentials: false
          allow-unsafe-pr-checkout: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        name: Set up NodeJS
        with:
          node-version: ${{ matrix.node }}
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        name: Set up PNPM
        with:
          version: 10.33.0
      # Workaround for puppeteer 24 on Node >= 26.1 (and >= 24.16): it unzips
      # Chrome with extract-zip, which silently stops mid-extraction on these
      # Node versions. The install still exits 0, but leaves a partial Chrome
      # in the puppeteer cache, so karma cannot start it. See:
      # - https://github.com/puppeteer/puppeteer/issues/14957
      # - https://github.com/puppeteer/puppeteer/issues/15071
      # This is fixed in puppeteer 25, which requires Node >= 22.12. Until
      # Node < 22.12 is dropped from the matrix, puppeteer's Chrome download is
      # skipped and the tests use the Chrome preinstalled on the runner instead
      # (CHROME_BIN, read by test/it/karma.conf.js).
      - name: Install
        run: pnpm install
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - name: Test
        run: pnpm test
        env:
          CHROME_BIN: ${{ matrix.chrome_bin }}
